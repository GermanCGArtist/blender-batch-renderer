[package]
name = "bbr"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Blender Batch Renderer - Rust rewrite of the Python bbr tool"
license = "MIT"

[[bin]]
name = "bbr"
path = "src/main.rs"

[features]
default = []
# The desktop GUI (egui). Build with: cargo build --features gui
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
csv = "1"
rust_xlsxwriter = "0.79"
ctrlc = "3"
eframe = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
lto = true
strip = true
codegen-units = 1