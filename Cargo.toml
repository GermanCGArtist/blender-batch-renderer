[workspace]
resolver = "2"
members = ["crates/bbr-core", "crates/bbr-cli"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
